<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" fill="none">
  <circle cx="430" cy="120" r="150" fill="#b226f3" opacity="0.12"/>
  <circle cx="110" cy="380" r="130" fill="#4cdc98" opacity="0.14"/>

  <!-- dotted grid texture -->
  <g fill="#d9c8ec">
    <circle cx="500" cy="410" r="2.5"/>
    <circle cx="480" cy="430" r="2.5"/>
    <circle cx="520" cy="430" r="2.5"/>
    <circle cx="500" cy="450" r="2.5"/>
    <circle cx="480" cy="470" r="2.5"/>
    <circle cx="520" cy="470" r="2.5"/>
    <circle cx="40" cy="80" r="2.5"/>
    <circle cx="60" cy="60" r="2.5"/>
    <circle cx="20" cy="60" r="2.5"/>
  </g>

  <!-- main dashboard card -->
  <rect x="60" y="70" width="340" height="260" rx="20" fill="#ffffff" stroke="#ece1f7" stroke-width="1.5"/>
  <rect x="60" y="70" width="340" height="44" rx="20" fill="#faf7fd"/>
  <rect x="60" y="92" width="340" height="22" fill="#faf7fd"/>
  <circle cx="86" cy="92" r="5" fill="#b226f3"/>
  <circle cx="104" cy="92" r="5" fill="#4cdc98"/>
  <circle cx="122" cy="92" r="5" fill="#e3d7f0"/>

  <!-- skeleton title lines -->
  <rect x="90" y="140" width="120" height="12" rx="6" fill="#eee3f9"/>
  <rect x="90" y="162" width="80" height="9" rx="4.5" fill="#f2e9fa"/>

  <!-- bar chart -->
  <rect x="90" y="220" width="26" height="72" rx="7" fill="#b226f3"/>
  <rect x="128" y="188" width="26" height="104" rx="7" fill="#4cdc98"/>
  <rect x="166" y="234" width="26" height="58" rx="7" fill="#eee3f9"/>
  <rect x="204" y="170" width="26" height="122" rx="7" fill="#b226f3" opacity="0.55"/>
  <rect x="242" y="206" width="26" height="86" rx="7" fill="#4cdc98" opacity="0.55"/>

  <!-- floating badge card -->
  <g transform="translate(288,250)">
    <rect x="0" y="0" width="176" height="94" rx="18" fill="#1c0b2e"/>
    <circle cx="32" cy="32" r="17" fill="#4cdc98"/>
    <path d="M24 32l5.5 5.5L40 26" stroke="#1c0b2e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="23" width="94" height="9" rx="4.5" fill="#ffffff"/>
    <rect x="58" y="41" width="62" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
    <rect x="20" y="62" width="136" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Z mark watermark badge -->
  <g transform="translate(48,340)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#ffffff" stroke="#ece1f7" stroke-width="1.5"/>
    <text x="32" y="45" font-family="Bricolage Grotesque, Arial, sans-serif" font-weight="800" font-size="30" fill="#b226f3" text-anchor="middle">Z</text>
  </g>

  <!-- floating dots -->
  <circle cx="474" cy="330" r="6" fill="#b226f3"/>
  <circle cx="496" cy="360" r="4" fill="#4cdc98"/>
</svg>
